name: Agent Knowledge Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-knowledge-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-agent-knowledge:
    name: Agent Knowledge Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check validator syntax
        run: perl -c scripts/validate-agent-knowledge.pl
      - name: Run canonical contract tests
        run: prove -v tests/agent_knowledge_validator
      - name: Run canonical range validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: perl scripts/validate-agent-knowledge.pl --scope range --base "$BASE_SHA" --head "$HEAD_SHA"
