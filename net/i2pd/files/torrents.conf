# Optional BitTorrent tunnel configuration for i2pd.
# Merge these settings into /etc/i2pd/tunnels.conf to enable it.
# The daemon reads tunnel definitions from one file via --tunconf.
# The RPC interface below is bound to localhost for local access only.
# Leave it commented until you intend to run the torrent client.
#
#[torrents]
#type = torrents
#torrentsdir = /var/i2pd/torrents
#keys = torrents-keys.dat
#dht = true
#web = true
#rpcaddress = 127.0.0.1
#rpcport = 7652
